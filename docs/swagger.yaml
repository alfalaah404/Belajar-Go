basePath: /
definitions:
  main.ApiResponse:
    properties:
      data: {}
      message:
        example: Success
        type: string
      status:
        example: success
        type: string
    type: object
  main.Category:
    properties:
      description:
        example: Produk elektronik dan gadget
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Elektronik
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API untuk mengelola kategori produk
  title: Category API
  version: "1.0"
paths:
  /categories:
    get:
      consumes:
      - application/json
      description: Get list of all categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/main.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.Category'
                  type: array
              type: object
      summary: List all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category with the provided information
      parameters:
      - description: Category object
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/main.Category'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/main.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/main.Category'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ApiResponse'
      summary: Create a new category
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ApiResponse'
      summary: Delete category
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: Get a single category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/main.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/main.Category'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ApiResponse'
      summary: Get category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update an existing category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Category object
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/main.Category'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/main.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/main.Category'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ApiResponse'
      summary: Update category
      tags:
      - categories
  /up:
    get:
      consumes:
      - application/json
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ApiResponse'
      summary: Health check endpoint
      tags:
      - health
swagger: "2.0"
